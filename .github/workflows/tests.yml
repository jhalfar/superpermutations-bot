name: tests
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -I checker/build.py
      - run: python -I tests/test_check.py
      - run: python -I tests/test_bot.py
      - run: python -I tests/test_spra.py
      - run: python -I tests/test_ui.py
      - run: python -I tests/test_history.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build .
